apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: default
  labels:
    app: vulnerable-app
    security: testing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
        security: testing
    spec:
      containers:
      - name: vulnerable-app
        image: 949056170306.dkr.ecr.us-east-1.amazonaws.com/secure-demo-app:v1.0-slim
        ports:
        - containerPort: 5000
          name: http
        
        # resources: {}
       
        securityContext:
          runAsUser: 0  # Running as root
          allowPrivilegeEscalation: true
          capabilities:
            add: ["SYS_ADMIN", "NET_ADMIN"]  
        env:
        - name: SECRET_KEY
          value: "super-secret-key-123"
        - name: DB_PASSWORD  
          value: "admin123"
        - name: DEBUG
          value: "true"
       
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-app-service
  namespace: default
  labels:
    app: vulnerable-app
spec:
  selector:
    app: vulnerable-app
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  type: LoadBalancer 

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vulnerable-app-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: vulnerable-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {}  
  egress:
  - {}  

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulnerable-app-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vulnerable-app-role
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]  
- apiGroups: ["apps"]
  resources: ["*"]
  verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vulnerable-app-binding
subjects:
- kind: ServiceAccount
  name: vulnerable-app-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: vulnerable-app-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vulnerable-app-config
  namespace: default
data:
  database_url: "sqlite:///users.db"
  secret_key: "super-secret-key-123"
  admin_password: "admin123"
  debug_mode: "true"